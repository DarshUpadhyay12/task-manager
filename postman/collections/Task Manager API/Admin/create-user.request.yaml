$kind: http-request
method: POST
url: '{{baseUrl}}/api/users'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test User",
      "email": "{{newUserEmail}}",
      "password": "password123",
      "isAdmin": false
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set("newUserEmail", `postman-${Date.now()}@example.com`);
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const user = pm.response.json();
        if (Number.isInteger(user.id) && user.id > 0) {
          pm.environment.set("userId", String(user.id));
        }
      }
    language: text/javascript
